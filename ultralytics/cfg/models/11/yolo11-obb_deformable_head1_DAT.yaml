# Ultralytics YOLO11-obb Oriented Bounding Boxes (OBB) model with P3/8 - P5/32 outputs
# Model docs: https://docs.ultralytics.com/models/yolo11
# Task docs: https://docs.ultralytics.com/tasks/obb

# Parameters
nc: 80 # number of classes
scales:
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

# YOLO11n backbone
backbone:
  - [-1, 1, Conv, [64, 3, 2]]        # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]]       # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]] # 2
  - [-1, 1, Conv, [256, 3, 2]]       # 3-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]] # 4
  - [-1, 1, Conv, [512, 3, 2]]       # 5-P4/16
  - [-1, 2, C3k2, [512, True]]       # 6
  - [-1, 1, Conv, [1024, 3, 2]]      # 7-P5/32
  - [-1, 2, C3k2, [1024, True]]      # 8
  - [-1, 1, SPPF, [1024, 5]]         # 9
  - [-1, 2, C2PSA, [1024]]           # 10
  # - [-1, 1, SimpleDeformTransEncoder, [1024]]  # 11 (if used)

# YOLO11n head
head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]     # 11
  - [[-1, 6], 1, Concat, [1]]                      # 12 (cat backbone P4)
  - [-1, 2, C3k2, [512, False]]                    # 13 ← 原第13层

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]     # 15
  - [[-1, 4], 1, Concat, [1]]                      # 16 (cat backbone P3)
  - [-1, 2, C3k2, [256, False]]                    # 17 (P3/8-small)

  - [-1, 1, Conv, [256, 3, 2]]                     # 18
  - [[-1, 14], 1, Concat, [1]]                     # 19 ← 关键！连接 DATBlock 输出（原为13，现为14）
  - [-1, 2, C3k2, [512, False]]                    # 20 (P4/16-medium)
  - [-1, 1, DATBlock, [512]]                       # 14 ← 新增 DATBlock

  - [-1, 1, Conv, [512, 3, 2]]                     # 21
  - [[-1, 10], 1, Concat, [1]]                     # 22 (cat from backbone layer 10)
  - [-1, 2, C3k2, [1024, True]]                    # 23 (P5/32-large)

  - [17, 1, SimpleDeformTransEncoder, [256]]       # 24 (was 16 → now 17 is P3 output)

  - [[23, 20, 24], 1, OBB, [nc, 1]]                # 25 ← Detect: [P4, P5, enhanced P3]